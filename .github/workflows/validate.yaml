name: Validate deployment package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          python scripts/install-tools.py
          echo "$PWD/.tools" >> "$GITHUB_PATH"
          pip install -r requirements-dev.txt
      - name: Render and validate
        run: |
          make render
          git diff --exit-code -- k8s
          make validate
  postgres-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build, scan, generate SBOM and qualify restricted database
        run: python3 scripts/qualify_postgres.py --output evidence/postgres
      - name: Retain qualification evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/postgres
          retention-days: 7
          if-no-files-found: error
